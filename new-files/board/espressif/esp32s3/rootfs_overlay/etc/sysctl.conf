# Stack size for binaries whose ELF declares none.
#
# On NOMMU the stack is a plain allocation made once at exec time: there is no
# guard page and MAP_GROWSDOWN does nothing, so an overflow is silent memory
# corruption rather than a SIGSEGV. Several shipped programs -- curl,
# wpa_supplicant, dropbear, nano, iw -- have a zero PT_GNU_STACK and land on
# this value, and 16384 is tight for the mbedTLS bignum and certificate chain
# paths curl reaches. The build manifest lists which binaries rely on it.
#
# Raising it costs the difference once per such process, not per system.
kernel.default_stack_size = 32768
