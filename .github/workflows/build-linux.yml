name: Build Linux ESP32-S3

on:
  workflow_dispatch:
    inputs:
      reuse_build_from_run:
        description: >-
          Run ID whose esp32-linux-raw-build artifact to package, instead of
          compiling again. Leave empty for a full build.
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-tests:
    name: Host-only checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check the shell scripts parse
        run: |
          for f in flash.sh make-images.sh build/reproduce.sh run.sh; do
            sh -n "$f" 2>/dev/null || bash -n "$f"
          done

      - name: Flasher regression tests
        run: python3 build/test-flash.py

      - name: Shell fallback tests
        run: python3 build/test-shell-fallback.py

  build:
    name: Compile Linux and firmware
    if: inputs.reuse_build_from_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show runner resources
        run: |
          echo "CPU cores:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          docker system prune -af || true

          echo "Disk after cleanup:"
          df -h

      - name: Build Docker image
        run: |
          docker build \
            --file new-files/toplevel/Dockerfile \
            --tag linux-on-esp32s3:ci \
            .

      - name: Create build container
        run: |
          docker create \
            --name esp32-linux-builder \
            linux-on-esp32s3:ci

      - name: Build Linux and firmware
        run: |
          docker start --attach esp32-linux-builder

      - name: Copy build output from container
        run: |
          mkdir -p build-output

          docker cp \
            esp32-linux-builder:/work/esp32-linux-build/build/. \
            build-output/

          echo "Copied build files:"
          du -sh build-output
          find build-output -maxdepth 2 -type f | head -100

      - name: Upload raw build output
        uses: actions/upload-artifact@v7
        with:
          name: esp32-linux-raw-build
          path: build-output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
          include-hidden-files: true

      - name: Remove build container
        if: always()
        run: |
          docker rm -f esp32-linux-builder 2>/dev/null || true

  package:
    name: Package flashable image
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download raw build output
        if: inputs.reuse_build_from_run == ''
        uses: actions/download-artifact@v8
        with:
          name: esp32-linux-raw-build
          path: build-output

      - name: Download raw build output from an earlier run
        if: inputs.reuse_build_from_run != ''
        uses: actions/download-artifact@v8
        with:
          name: esp32-linux-raw-build
          path: build-output
          run-id: ${{ inputs.reuse_build_from_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show downloaded build
        run: |
          echo "Downloaded build size:"
          du -sh build-output

          echo
          echo "Top-level contents:"
          find build-output -maxdepth 2 -type f | head -100

      - name: Install esptool
        run: |
          python3 -m venv "$GITHUB_WORKSPACE/.venv"

          "$GITHUB_WORKSPACE/.venv/bin/python" \
            -m pip install --upgrade pip

          "$GITHUB_WORKSPACE/.venv/bin/python" \
            -m pip install esptool

          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

          "$GITHUB_WORKSPACE/.venv/bin/esptool" version

      - name: Prepare build tree for packaging
        run: |
          mkdir -p ci/esp32-linux-build

          ln -s \
            "$GITHUB_WORKSPACE/build-output" \
            "$GITHUB_WORKSPACE/ci/esp32-linux-build/build"

          ls -lah ci/esp32-linux-build
          ls -lah ci/esp32-linux-build/build | head

      - name: Restore host tool permissions
        run: |
          for d in build-output/build-buildroot-*/host; do
            [ -d "$d" ] || continue
            find "$d/bin" "$d/sbin" -type f -exec chmod +x {} + 2>/dev/null || true
          done

          ls -l build-output/build-buildroot-*/host/sbin/mkfs.jffs2 || \
            echo "no mkfs.jffs2 in the artifact; the home image will be skipped"

      - name: Set aside the committed images
        run: |
          cp -a images images-committed

          ls -la images-committed

      - name: Package flashable image
        run: |
          chmod +x make-images.sh

          ./make-images.sh \
            "$GITHUB_WORKSPACE/ci/esp32-linux-build"

      - name: Verify generated images
        run: |
          if ! compgen -G "images/*.bin" > /dev/null; then
            echo "Error: no .bin files were generated"
            find . -maxdepth 3 -type f | sort | tail -200
            exit 1
          fi

          ls -lah images/

      - name: Generate checksums
        run: |
          sha256sum images/*.bin | tee images/SHA256SUMS.txt

      - name: Compare against the images committed to the repository
        run: |
          exact="bootloader.bin partition-table.bin"

          emit() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          names() {
            ls "$1" 2>/dev/null | grep -vE '^SHA256SUMS\.txt$|\.example$' || true
          }

          emit "## Built here vs committed to the repository"
          emit ""
          emit "| image | committed | built | result |"
          emit "|---|---:|---:|---|"

          mismatch=""
          for n in $( { names images-committed; names images; } | sort -u ); do
            new="images/$n"
            old="images-committed/$n"

            if [ ! -f "$new" ]; then
              emit "| \`$n\` | $(stat -c%s "$old") | — | not produced by this build |"
              continue
            fi
            if [ ! -f "$old" ]; then
              emit "| \`$n\` | — | $(stat -c%s "$new") | not in the repository |"
              continue
            fi

            so=$(stat -c%s "$old")
            sn=$(stat -c%s "$new")

            if cmp -s "$old" "$new"; then
              r="identical"
            elif [ "$so" != "$sn" ]; then
              r="**different size**"
            else
              r="same size, different bytes"
            fi

            case " $exact " in
              *" $n "*)
                if [ "$r" != "identical" ]; then
                  r="$r — **expected identical**"
                  mismatch="$mismatch $n"
                fi
                ;;
            esac

            emit "| \`$n\` | $so | $sn | $r |"
          done

          emit ""
          if [ -n "$mismatch" ]; then
            emit "> Reproducibility: these must be byte-identical and are not:**$mismatch**"
            emit "> Everything else differing is expected — see DEVELOPMENT.md."
          else
            emit "> \`bootloader.bin\` and \`partition-table.bin\` match, as they must."
            emit "> The rest embed the build host and are expected to differ."
          fi

          echo
          echo "sha256 of what this run built:"
          cat images/SHA256SUMS.txt

      - name: Upload flashable images
        uses: actions/upload-artifact@v7
        with:
          name: linux-esp32s3-build
          path: |
            images/*.bin
            images/*.cramfs
            images/*.jffs2
            images/xipImage
            images/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
