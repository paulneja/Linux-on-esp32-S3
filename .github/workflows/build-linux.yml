name: Build Linux ESP32-S3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          echo "CPU cores:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          docker system prune -af || true

          echo "Disk after cleanup:"
          df -h

      - name: Build Docker image
        run: |
          docker build \
            --file new-files/toplevel/Dockerfile \
            --tag linux-on-esp32s3:ci \
            .

      - name: Create build container
        run: |
          docker create \
            --name esp32-linux-builder \
            linux-on-esp32s3:ci

      - name: Build Linux and firmware
        run: |
          docker start --attach esp32-linux-builder

      - name: Copy build output from container
        run: |
          mkdir -p build-output

          docker cp \
            esp32-linux-builder:/work/esp32-linux-build/build/. \
            build-output/

          echo "Copied build files:"
          du -sh build-output
          find build-output -maxdepth 2 -type f | head -100

      - name: Prepare build tree for packaging
        run: |
          mkdir -p ci/esp32-linux-build

          ln -s \
            "$GITHUB_WORKSPACE/build-output" \
            "$GITHUB_WORKSPACE/ci/esp32-linux-build/build"

      - name: Package flashable image
        run: |
          chmod +x make-images.sh

          ./make-images.sh \
            "$GITHUB_WORKSPACE/ci/esp32-linux-build"

      - name: Generate checksums
        run: |
          sha256sum images/*.bin | tee images/SHA256SUMS.txt

      - name: Show resulting files
        run: |
          ls -lah images/
          echo
          cat images/SHA256SUMS.txt

      - name: Upload flashable images
        uses: actions/upload-artifact@v4
        with:
          name: linux-esp32s3-build
          path: |
            images/*.bin
            images/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove build container
        if: always()
        run: |
          docker rm -f esp32-linux-builder 2>/dev/null || true
