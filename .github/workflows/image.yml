name: Image

on:
  # The host checks take minutes and catch the things that used to reach a
  # board: a script that does not parse, a patch that stopped applying, a
  # bashism in a file busybox sh has to run. Those run on every push. The
  # full image build stays manual.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-tests:
    name: Host-only checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check the shell scripts parse
        run: |
          status=0
          # Everything tracked with a shell shebang, rather than a list that
          # goes stale: the overlay scripts run on the board under busybox sh
          # and were never checked here at all.
          for f in $(git ls-files); do
            case "$(head -c 40 "$f" 2>/dev/null | tr -d '\0')" in
              '#!/bin/sh'*|'#! /bin/sh'*|'#!/usr/bin/dash'*)
                sh -n "$f" || status=1 ;;
              '#!/bin/bash'*|'#!/usr/bin/env bash'*)
                bash -n "$f" || status=1 ;;
            esac
          done
          exit "$status"

      - name: Check the overlay scripts for bashisms
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq devscripts
          status=0
          # These run under busybox sh on the board. A bashism here does not
          # fail the build, it fails at boot.
          for f in $(git ls-files 'new-files/board/espressif/esp32s3/rootfs_overlay' \
                                  'new-files/board/espressif/esp32s3/*.sh'); do
            case "$(head -c 40 "$f" 2>/dev/null | tr -d '\0')" in
              '#!/bin/sh'*|'#! /bin/sh'*) checkbashisms "$f" || status=1 ;;
            esac
          done
          exit "$status"

      - name: Check the patches are well formed
        run: |
          status=0
          for p in new-files/board/espressif/esp32s3/patches/linux/*.patch \
                   patches/*.patch experiments/mmu-poc/fork/*.patch; do
            grep -q '^--- ' "$p" || { echo "$p: no diff header"; status=1; }
            grep -q '^+++ ' "$p" || { echo "$p: no diff header"; status=1; }
            # A binary hunk cannot be reconstructed by git apply and is
            # rejected in full; incident 5 in DEVELOPMENT.md is this.
            if grep -q '^Binary files' "$p"; then
              echo "$p: carries a binary hunk, which git apply cannot replay"
              status=1
            fi
          done
          exit "$status"

      - name: Check the kernel patches apply to the pinned kernel, in order
        run: |
          set -e
          . build/sources.lock
          curl -fsSL --retry 3 -o linux.tar.xz \
              "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-$LINUX_VERSION.tar.xz"
          echo "$LINUX_TARBALL_SHA256  linux.tar.xz" | sha256sum -c -
          sed -n 's|^+++ b/\([^[:space:]]*\).*|\1|p' \
              new-files/board/espressif/esp32s3/patches/linux/*.patch \
              experiments/mmu-poc/fork/*.patch experiments/mmu-poc/fork/real/scheduler.patch \
              | sort -u | sed "s|^|linux-$LINUX_VERSION/|" > touched
          tar -xJf linux.tar.xz --ignore-failed-read -T touched 2>/dev/null || true
          mv "linux-$LINUX_VERSION" kernel-pin
          test "$(find kernel-pin -type f | wc -l)" -ge 15 || { echo "extract produced too few files"; exit 1; }
          cd kernel-pin
          apply() {
            out=$(patch -p1 -f --no-backup-if-mismatch < "$1" 2>&1) || { echo "$out"; return 1; }
            echo "$out" | grep -qE 'FAILED|fuzz|No file to patch' && { echo "$out"; return 1; }
            return 0
          }
          for p in ../new-files/board/espressif/esp32s3/patches/linux/*.patch; do
            echo "== $(basename "$p")"; apply "$p"
          done
          for p in kernel real/scheduler reclaim quiet-trace swap-banks switch-latency switch-irqs-on \
                   mmu-swap bank-budget; do
            echo "== fork/$p.patch"; apply "../experiments/mmu-poc/fork/$p.patch"
          done

      - name: Check the kernel-driver-esp32-ng/ reference copy is not stale
        run: |
          stale=0
          for f in kernel-pin/drivers/net/wireless/espressif/esp32-ng/*; do
            ref="kernel-driver-esp32-ng/$(basename "$f")"
            if ! cmp -s "$ref" "$f"; then
              echo "$ref is stale:"
              diff -u "$ref" "$f" || true
              stale=1
            fi
          done
          exit "$stale"

      - name: Check no file is carried by both a patch and new-files
        run: |
          # DEVELOPMENT.md incident 5: the rsync wins, so the patch copy is
          # invisible and free to drift out of step.
          status=0
          for f in $(grep '^diff --git' patches/03-buildroot-tracked-changes.patch |
                     sed 's|.* b/||'); do
            rel=${f#board/espressif/esp32s3/}
            if [ -e "new-files/board/espressif/esp32s3/$rel" ]; then
              echo "$f is carried by both patch 03 and new-files/"
              status=1
            fi
          done
          exit "$status"

      - name: Check the Python parses
        run: |
          for f in build/*.py experiments/mmu-poc/programs/*.py \
                   experiments/mmu-poc/fork/*.py; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f"
          done

      - name: Flasher regression tests
        run: python3 build/test-flash.py

      - name: Shell fallback tests
        run: python3 build/test-shell-fallback.py

      - name: Kernel config guard tests
        run: python3 build/test-kernel-config.py

      - name: Kept-configuration tests
        run: python3 build/test-keepconfig.py

      - name: wifi script tests
        run: python3 build/test-wifi-script.py

      - name: First login tests
        run: python3 build/test-first-login.py

      - name: remote-login, ssh-server and web-server tests
        run: python3 build/test-remote-login.py

      - name: bootlog tests
        run: python3 build/test-bootlog.py

      - name: bash vfork patch tests
        run: python3 build/test-bash-vfork.py

      - name: Soak classifier tests
        run: python3 build/test-soak-boot.py

      - name: Clock, NTP, BLE, USB console and use-shell tests
        run: python3 build/test-services.py

  build:
    name: Full image ${{ matrix.run }}
    needs: host-tests
    # Manual only, as the comment at the top says.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force || true
          echo "Disk after cleanup:"
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Give git an identity
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          test -n "$(git config user.name)"
          test -n "$(git config user.email)"

      - name: Build everything from pinned sources
        run: JOBS=$(nproc) bash build/reproduce.sh

      - name: Report the disk left
        if: always()
        run: df -h /

      - name: Locate the artifacts
        id: out
        run: |
          dir=$(ls -dt build-output/reproduce.*/artifacts | head -1)

          test -d "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Verify the checksums
        working-directory: ${{ steps.out.outputs.dir }}
        run: sha256sum -c SHA256SUMS

      - name: Report what was built
        run: |
          {
            echo "## Build ${{ matrix.run }}"
            echo
            echo "Source commit \`${{ github.sha }}\`. Board verification stays"
            echo "pending: this runner has no hardware attached."
            echo
            echo '```'
            cat "${{ steps.out.outputs.dir }}/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the images
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.run }}
          path: ${{ steps.out.outputs.dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.run }}
          path: build-output/reproduce.*/logs/
          if-no-files-found: warn
          retention-days: 14

  compare:
    name: Compare the two builds
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download the first build
        uses: actions/download-artifact@v8
        with:
          name: image-1
          path: left/artifacts

      - name: Download the second build
        uses: actions/download-artifact@v8
        with:
          name: image-2
          path: right/artifacts

      - name: Compare every artifact
        run: python3 build/compare-builds.py left right --output comparison.json

      - name: Summarise the differences
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path('comparison.json')
          if not path.exists():
              print('## Reproducibility\n\nThe comparison did not produce a report.')
              raise SystemExit(0)
          report = json.loads(path.read_text())
          print('## Reproducibility\n')
          print('Same source commit:', report['same_source_commit'], '\n')
          print('| artifact | result |')
          print('|---|---|')
          for name, entry in report['artifacts'].items():
              print(f"| `{name}` | {'identical' if entry['identical'] else 'differs'} |")
          differences = sorted(report['rootfs_differences'])
          print('\nRootfs entries that differ:',
                ', '.join(f'`{name}`' for name in differences) if differences else 'none')
          PY

      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comparison
          path: comparison.json
          if-no-files-found: warn
